# 1. Variables de Entorno Globales: Crea un workflow que defina una variable de entorno a nivel de workflow y 
# la use en dos jobs distintos.

name: Ejercicio 1

on:
  workflow_dispatch:

env:
  MENSAJE: "Hola desde GitHub Actions"

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar variable en Job 1
        run: echo "$MENSAJE"

  job2:
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar variable en Job 2
        run: echo "$MENSAJE"
